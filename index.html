<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Base Eleitoral — Mauriti 2026</title>
<style>
:root{--ink:#17202a;--mut:#65717d;--navy:#183153;--line:#e1e6eb;--bar:#cfe0f5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#f4f6f8}
*{box-sizing:border-box}body{margin:0}
header{background:var(--navy);color:#fff;padding:22px 5%}
header h1{margin:0 0 4px;font-size:24px}header p{margin:0;opacity:.85}
main{max-width:1100px;margin:20px auto;padding:0 14px}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 6px #0000001a;margin-bottom:16px}
label{display:block;font-weight:700;margin-bottom:6px;font-size:14px}
input,select{width:100%;padding:12px;border:1px solid #c5ccd3;border-radius:8px;font-size:16px;background:#fff;color:var(--ink)}
:focus-visible{outline:3px solid #3b7dd8;outline-offset:1px}
.row{display:grid;grid-template-columns:2fr 1fr;gap:12px}
#sug{margin:8px 0 0;padding:0;list-style:none;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}
#sug li button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:#fff;font:inherit;cursor:pointer;color:var(--ink)}
#sug li button:hover,#sug li button:focus-visible{background:#eef3fa}
#sug small{color:var(--mut);white-space:nowrap}
.stats{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-top:14px}
.stat{background:#f5f7fa;border-radius:9px;padding:12px 14px}.stat small{display:block;color:var(--mut);margin-bottom:3px}.stat strong{font-size:20px;word-break:break-word}
.tabs{display:inline-flex;border:1px solid var(--navy);border-radius:8px;overflow:hidden;margin-bottom:14px}
.tabs button{padding:10px 16px;border:0;background:#fff;color:var(--navy);font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--navy);color:#fff}
.tools{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:12px}.chk input{width:auto}
.muted{color:var(--mut)}.hidden{display:none}
details.loc{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
details.loc summary{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;position:relative;list-style:none}
details.loc summary::-webkit-details-marker{display:none}
details.loc summary::before{content:"▸";color:var(--mut);margin-right:2px}
details[open].loc summary::before{content:"▾"}
.ln{flex:1;min-width:0}.ln b{display:block}.ln small{color:var(--mut)}
.lv{text-align:right;font-weight:700;font-size:18px;white-space:nowrap}.lv small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.bar{position:absolute;left:0;bottom:0;height:3px;background:#3b7dd8}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;border-top:1px solid var(--line);text-align:left}th{background:#edf1f5}
td:last-child,th:last-child{text-align:right}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px}
@media(max-width:700px){.row,.tools,.stats{grid-template-columns:1fr}header h1{font-size:20px}.tabs{display:flex}.tabs button{flex:1}}
</style>
</head>
<body>
<header><h1>🗳️ Base Eleitoral — Mauriti 2026</h1><p>Votos por candidato, local de votação e seção</p></header>
<main>
<section class="card">
<div class="row">
<div><label for="q">Candidato (nome ou número)</label><input id="q" type="search" placeholder="Digite para buscar…" autocomplete="off"></div>
<div><label for="cargo">Cargo</label><select id="cargo"><option value="">Todos os cargos</option></select></div>
</div>
<ul id="sug" class="hidden"></ul>
<div id="info" class="stats hidden">
<div class="stat"><small id="cg"></small><strong id="nome"></strong></div>
<div class="stat"><small>Número</small><strong id="num"></strong></div>
<div class="stat"><small>Total de votos</small><strong id="tot"></strong></div>
</div>
</section>
<section id="res" class="card hidden">
<div class="tabs" role="group" aria-label="Forma de agrupar">
<button id="bLocal" type="button" aria-pressed="true">Por local de votação</button>
<button id="bSecao" type="button" aria-pressed="false">Por seção</button>
</div>
<div class="tools">
<div><label for="f">Filtrar por local ou seção</label><input id="f" type="search" placeholder="Ex.: André Cartaxo, 301…" autocomplete="off"></div>
<div><label for="ord">Ordenar por</label><select id="ord"><option value="v">Mais votos</option><option value="n">Nome / número</option></select></div>
</div>
<label class="chk"><input id="zero" type="checkbox"> Ocultar quem teve 0 voto</label>
<p id="cnt" class="muted"></p>
<div id="out"></div>
</section>
<section id="empty" class="card"><p class="muted">Busque um candidato acima para ver a votação.</p></section>
</main>

  if(tot>40)sug.innerHTML+='<li style="padding:10px 12px" class="muted">Mostrando 40 de '+tot+'. Digite mais para refinar.</li>';
  sug.classList.remove('hidden');
}
sug.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)pick(+b.getAttribute('data-i'))});
function pick(i){cur=i;var k=D.k[i];q.value=k[2];sug.classList.add('hidden');
  $('cg').textContent=D.c[k[0]];$('nome').textContent=k[2];$('num').textContent=k[1];$('tot').textContent=fmt(k[3]);
  $('info').classList.remove('hidden');$('res').classList.remove('hidden');$('empty').classList.add('hidden');f.value='';render()}

function render(){
  if(cur===null)return;
  var k=D.k[cur],v=k[4],t=norm(f.value.trim()),hide=zero.checked,byV=ord.value==='v',h='',n=0;
  if(view==='local'){
    var rows=[],max=1;
    D.l.forEach(function(l,li){
      var ss=LS[li],tv=0;ss.forEach(function(s){tv+=v[s]});
      if(hide&&!tv)return;
      if(t&&NL[li].indexOf(t)<0&&!ss.some(function(s){return norm(D.s[s][0]).indexOf(t)>=0}))return;
      if(tv>max)max=tv;rows.push({li:li,tv:tv,ss:ss})});
    rows.sort(function(a,b){return byV?b.tv-a.tv||D.l[a.li][0].localeCompare(D.l[b.li][0],'pt'):D.l[a.li][0].localeCompare(D.l[b.li][0],'pt')});
    rows.forEach(function(r){
      var l=D.l[r.li],ss=r.ss.slice().sort(function(a,b){return byV?v[b]-v[a]||secNum(a)-secNum(b):secNum(a)-secNum(b)});
      h+='<details class="loc"><summary><span class="ln"><b>'+esc(l[0])+'</b><small>'+esc(l[1])+' · '+ss.length+(ss.length>1?' seções':' seção')+'</small></span>'+
        '<span class="lv">'+fmt(r.tv)+'<small>'+(k[3]?(r.tv/k[3]*100).toFixed(1).replace('.',','):'0')+'% do total</small></span>'+
        '<i class="bar" style="width:'+(r.tv/max*100)+'%"></i></summary><table><thead><tr><th>Seção</th><th>Votos</th></tr></thead><tbody>'+
        ss.map(function(s){return '<tr><td>'+esc(D.s[s][0])+'</td><td>'+fmt(v[s])+'</td></tr>'}).join('')+'</tbody></table></details>'});
    n=rows.length;cnt.textContent=n+' local(is) de votação';
    out.innerHTML=h||'<p class="muted">Nenhum local encontrado.</p>';
  }else{
    var r2=[];
    D.s.forEach(function(s,i){
      if(hide&&!v[i])return;
      if(t&&norm(s[0]).indexOf(t)<0&&NL[s[1]].indexOf(t)<0)return;r2.push(i)});
    r2.sort(function(a,b){return byV?v[b]-v[a]||secNum(a)-secNum(b):secNum(a)-secNum(b)});
    cnt.textContent=r2.length+' seção(ões)';
    out.innerHTML=r2.length?'<div class="tw"><table><thead><tr><th>Seção</th><th>Local de votação</th><th>Votos</th></tr></thead><tbody>'+
      r2.map(function(i){var l=D.l[D.s[i][1]];return '<tr><td>'+esc(D.s[i][0])+'</td><td>'+esc(l[0])+'<br><small class="muted">'+esc(l[1])+'</small></td><td>'+fmt(v[i])+'</td></tr>'}).join('')+'</tbody></table></div>'
      :'<p class="muted">Nenhuma seção encontrada.</p>';
  }
}
function setView(x){view=x;$('bLocal').setAttribute('aria-pressed',x==='local');$('bSecao').setAttribute('aria-pressed',x==='secao');render()}
$('bLocal').onclick=function(){setView('local')};$('bSecao').onclick=function(){setView('secao')};
q.addEventListener('input',suggest);q.addEventListener('focus',suggest);
cargoSel.addEventListener('change',suggest);
f.addEventListener('input',render);ord.addEventListener('change',render);zero.addEventListener('change',render);
</script>
</body>
</html>
